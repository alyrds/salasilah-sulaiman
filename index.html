<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salasilah Keluarga Sulaiman</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%); 
            min-height: 100vh; 
            padding: 40px 20px; 
            color: #333;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #1e293b; font-size: 2.5rem; margin-bottom: 10px; text-shadow: 1px 1px 3px rgba(0,0,0,0.1); }
        .header p { color: #64748b; font-size: 1.1rem; }
        
        .ruang-pokok { 
            display: flex; justify-content: center; overflow-x: auto; padding-bottom: 40px;
        }

        /* Struktur Pokok (Sama seperti sebelum ini) */
        .tree ul { padding-top: 20px; position: relative; display: flex; justify-content: center; }
        .tree li { float: left; text-align: center; list-style-type: none; position: relative; padding: 20px 15px 0 15px; }
        .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid #94a3b8; width: 50%; height: 20px; }
        .tree li::after { right: auto; left: 50%; border-left: 2px solid #94a3b8; }
        .tree li:only-child::after, .tree li:only-child::before { display: none; }
        .tree li:only-child { padding-top: 0; }
        .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
        .tree li:last-child::before { border-right: 2px solid #94a3b8; border-radius: 0 10px 0 0; }
        .tree li:first-child::after { border-radius: 10px 0 0 0; }
        .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #94a3b8; width: 0; height: 20px; transform: translateX(-50%); }

        .pasangan-wrapper { display: flex; justify-content: center; align-items: center; gap: 15px; position: relative; }
        .garis-kahwin { width: 30px; height: 3px; background-color: #ef4444; border-radius: 2px; position: relative; }
        .pasangan-wrapper::after { content: ''; position: absolute; bottom: -20px; left: 50%; border-left: 2px solid #94a3b8; height: 20px; transform: translateX(-50%); }

        .kad-ahli { background: white; border-radius: 12px; padding: 15px 25px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 5px solid #3b82f6; min-width: 150px; position: relative; z-index: 2; }
        .kad-ahli.perempuan { border-top-color: #ec4899; }
        .avatar { width: 65px; height: 65px; border-radius: 50%; margin-bottom: 12px; border: 3px solid #f1f5f9; }
        .nama { font-weight: 700; color: #0f172a; font-size: 1.05rem; }
        .jantina { font-size: 0.75rem; color: #64748b; margin-top: 5px; text-transform: uppercase; font-weight: 600; }

        /* Reka Bentuk Borang Tambah Data */
        .ruang-borang {
            max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 20px;
        }
        .ruang-borang h2 { text-align: center; margin-bottom: 20px; color: #1e293b; font-size: 1.5rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #475569; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
        .btn-tambah { width: 100%; padding: 12px; background-color: #10b981; color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-tambah:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Salasilah Keluarga Datuk Sulaiman</h1>
        <p>Dokumentasi Digital Generasi Keluarga</p>
    </div>
    
    <div class="ruang-pokok">
        <div class="tree" id="senarai-keluarga">
            <p style="text-align:center; padding: 20px; font-weight: 600;">Memuat turun data salasilah...</p>
        </div>
    </div>

    <!-- Bahagian Borang -->
    <div class="ruang-borang">
        <h2>Tambah Ahli Keluarga</h2>
        <form id="borang-keluarga">
            <div class="form-group">
                <label>Nama Penuh</label>
                <input type="text" id="input_nama" required placeholder="Contoh: Ahmad Bin Abu">
            </div>
            <div class="form-group">
                <label>Jantina</label>
                <select id="input_jantina" required>
                    <option value="Lelaki">Lelaki</option>
                    <option value="Perempuan">Perempuan</option>
                </select>
            </div>
            <div class="form-group">
                <label>Pilih Bapa (Jika ada dalam sistem)</label>
                <select id="input_bapa">
                    <option value="">-- Tiada / Belum Direkodkan --</option>
                </select>
            </div>
            <div class="form-group">
                <label>Pilih Ibu (Jika ada dalam sistem)</label>
                <select id="input_ibu">
                    <option value="">-- Tiada / Belum Direkodkan --</option>
                </select>
            </div>
            <button type="submit" class="btn-tambah">Simpan Rekod</button>
        </form>
    </div>

    <script>
        // MASUKKAN KUNCI API ANDA DI SINI
        const supabaseUrl = 'https://waybudfnieibokxzkjjl.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndheWJ1ZGZuaWVpYm9reHprampsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NjQwMjUsImV4cCI6MjEwNTM0MDAyNX0.yyAuvvKCZ4P4j0xYZ30eOk5lw1XIqWaqarojniAkAwI'; 
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let dataKeluargaSediaAda = []; // Simpan sementara untuk dropdown

        function binaKad(ahli) {
            const kelasJantina = ahli.jantina.toLowerCase() === 'perempuan' ? 'perempuan' : 'lelaki';
            const urlAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(ahli.nama_penuh)}&background=random&color=fff&bold=true&size=128`;
            return `
                <div class="kad-ahli ${kelasJantina}">
                    <img src="${urlAvatar}" class="avatar" alt="Avatar">
                    <div class="nama">${ahli.nama_penuh}</div>
                    <div class="jantina">${ahli.jantina}</div>
                </div>
            `;
        }

        function cariPasangan(individu, semuaData) {
            let anak;
            if (individu.jantina.toLowerCase() === 'lelaki') {
                anak = semuaData.find(a => a.id_bapa === individu.id && a.id_ibu !== null);
                if (anak) return semuaData.find(p => p.id === anak.id_ibu);
            } else {
                anak = semuaData.find(a => a.id_ibu === individu.id && a.id_bapa !== null);
                if (anak) return semuaData.find(p => p.id === anak.id_bapa);
            }
            return null;
        }

        function binaPokok(semuaData, idInduk = null) {
            let senaraiAnak;
            if (idInduk === null) {
                senaraiAnak = semuaData.filter(ahli => ahli.id === 1); // Mula dari akar (ID 1)
            } else {
                const induk = semuaData.find(a => a.id === idInduk);
                senaraiAnak = induk.jantina.toLowerCase() === 'lelaki' 
                    ? semuaData.filter(ahli => ahli.id_bapa === idInduk)
                    : semuaData.filter(ahli => ahli.id_ibu === idInduk);
            }

            if (senaraiAnak.length === 0) return ''; 

            let html = '<ul>';
            senaraiAnak.forEach(anak => {
                const pasangan = cariPasangan(anak, semuaData);
                let htmlKadUtama = binaKad(anak);
                let kotakGabungan = htmlKadUtama;
                
                if (pasangan) {
                    const htmlKadPasangan = binaKad(pasangan);
                    kotakGabungan = anak.jantina.toLowerCase() === 'lelaki' 
                        ? `<div class="pasangan-wrapper">${htmlKadUtama} <div class="garis-kahwin"></div> ${htmlKadPasangan}</div>`
                        : `<div class="pasangan-wrapper">${htmlKadPasangan} <div class="garis-kahwin"></div> ${htmlKadUtama}</div>`;
                } else {
                    kotakGabungan = `<div class="pasangan-wrapper" style="gap:0;">${htmlKadUtama}</div>`;
                }

                html += `<li>${kotakGabungan}${binaPokok(semuaData, anak.id)}</li>`;
            });
            html += '</ul>';
            return html;
        }

        // Kemas kini pilihan bapa dan ibu dalam dropdown borang
        function kemaskiniDropdown() {
            const dropdownBapa = document.getElementById('input_bapa');
            const dropdownIbu = document.getElementById('input_ibu');
            
            // Kosongkan pilihan lama kecuali pilihan pertama
            dropdownBapa.innerHTML = '<option value="">-- Tiada / Belum Direkodkan --</option>';
            dropdownIbu.innerHTML = '<option value="">-- Tiada / Belum Direkodkan --</option>';

            dataKeluargaSediaAda.forEach(ahli => {
                const pilihan = `<option value="${ahli.id}">${ahli.nama_penuh}</option>`;
                if (ahli.jantina.toLowerCase() === 'lelaki') dropdownBapa.innerHTML += pilihan;
                else dropdownIbu.innerHTML += pilihan;
            });
        }

        async function paparDataKeluarga() {
            const { data, error } = await supabaseClient
                .from('ahli_keluarga')
                .select('*')
                .order('id', { ascending: true }); 

            if (error) {
                console.error(error); return;
            }

            dataKeluargaSediaAda = data; // Simpan untuk borang
            kemaskiniDropdown(); // Masukkan nama dalam borang

            const rangkaCarta = binaPokok(data, null);
            document.getElementById('senarai-keluarga').innerHTML = rangkaCarta;
        }

        // Fungsi menghantar data borang ke Supabase
        document.getElementById('borang-keluarga').addEventListener('submit', async function(event) {
            event.preventDefault(); // Halang page dari refresh
            
            const butang = document.querySelector('.btn-tambah');
            butang.innerText = "Menyimpan...";
            butang.disabled = true;

            const nama = document.getElementById('input_nama').value;
            const jantina = document.getElementById('input_jantina').value;
            const bapa = document.getElementById('input_bapa').value || null;
            const ibu = document.getElementById('input_ibu').value || null;

            const { data, error } = await supabaseClient
                .from('ahli_keluarga')
                .insert([
                    { nama_penuh: nama, jantina: jantina, id_bapa: bapa, id_ibu: ibu }
                ]);

            if (error) {
                alert("Ralat menyimpan rekod: " + error.message);
            } else {
                alert("Rekod berjaya ditambah!");
                document.getElementById('borang-keluarga').reset(); // Kosongkan borang
                paparDataKeluarga(); // Lukis semula pokok dengan data baru
            }

            butang.innerText = "Simpan Rekod";
            butang.disabled = false;
        });

        // Mula jalankan sistem
        paparDataKeluarga();
    </script>
</body>
</html>
